name: Build & Push Docker Image to ACR

on:
  push:
    branches:
      - Project    # Change this to your actual branch name if needed (e.g. main)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Maven
        uses: s4u/setup-maven-action@v1
        with:
          maven-version: '3.9.6'

      - name: Build JAR
        run: mvn clean package -DskipTests

      - name: Log in to ACR
        run: echo "${{ secrets.ACR_PASSWORD }}" | docker login aaravregistry.azurecr.io -u ${{ secrets.ACR_USERNAME }} --password-stdin

      - name: Build Docker image
        run: docker build -t aaravregistry.azurecr.io/acidemo:latest .

      - name: Push Docker image
        run: docker push aaravregistry.azurecr.io/acidemo:latest

