name: Build and Push Docker Image

on:
  push:
    branches:
      - Project  # change this to your branch name if different

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build JAR file
        run: |
          ./mvnw clean package -DskipTests

      - name: Log in to Azure Container Registry
        run: echo "${{ secrets.ACR_PASSWORD }}" | docker login aaravregistry.azurecr.io -u ${{ secrets.ACR_USERNAME }} --password-stdin

      - name: Build Docker image
        run: docker build -t aaravregistry.azurecr.io/acidemo:latest .

      - name: Push Docker image to ACR
        run: docker push aaravregistry.azurecr.io/acidemo:latest

