name: Build & Push Docker Image to ACR

on:
  push:
    branches:
      - Project  # Or your actual working branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java 17 and Maven
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build JAR with Maven
        run: mvn clean package -DskipTests

      - name: Log in to ACR
        run: echo "${{ secrets.ACR_PASSWORD }}" | docker login aaravregistry.azurecr.io -u ${{ secrets.ACR_USERNAME }} --password-stdin

      - name: Build Docker image
        run: docker build -t aaravregistry.azurecr.io/acidemo:latest .

      - name: Push Docker image
        run: docker push aaravregistry.azurecr.io/acidemo:latest

