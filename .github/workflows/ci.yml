name: Build and Push Docker Image to ACR

on:
  push:
    branches:
      - main
      - Project  # update this if you're using a different branch name

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Maven
        uses: s4u/setup-maven-action@v1
        with:
          maven-version: '3.9.6'

      - name: Build JAR file
        run: mvn clean package -DskipTests

      - name: Log in to Azure Container Registry
        run: echo "${{ secrets.ACR_PASSWORD }}" | docker login aaravregistry.azurecr.io -u aaravregistry --password-stdin

      - name: Build Docker image
        run: docker build -t aaravregistry.azurecr.io/acidemo:latest .

      - name: Push Docker image to ACR
        run: docker push aaravregistry.azurecr.io/acidemo:latest
